name: "p1"
on:
  workflow_dispatch: 
  push:
    branches: 
      - "main"
      - "dev"
    paths:
      - ".github/**"
jobs:
  github_context:
    runs-on: ubuntu-latest
    steps:
      - name: understand github context
        run: echo ${{toJson(github)}}
  init_job:
    runs-on: ubuntu-24.04
    steps:
      - name: Get Code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          check_latest: false
      - name: Confirm node.js
        run: |
          echo "Node & NPM Version:"
          node --version
          npm --version
    
  first_job:
    needs: init_job
    runs-on: ubuntu-22.04
    steps:
      - name: check os
        run: cat /etc/os-release
      - name: check cpu & memory
        run: |
          echo "CPU:"
          w
          echo "Memory:"
          free -m
  
